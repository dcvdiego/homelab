services:
  smtp-relay:
    image: devture/exim-relay:4.98-r0-4@sha256:7ba30080c7a6ac4e93a99143ebd1aa229a16c47b97b2129002dc753c8a47f095
    container_name: smtp-relay
    restart: unless-stopped
    environment:
      # Names as read by the image's exim.conf (github.com/devture/exim-relay). SMARTHOST is host::port.
      HOSTNAME: smtp-relay.homelab.lan   # HELO name; Gmail drops connections with an empty one
      RELAY_FROM_HOSTS: 172.16.0.0/12    # Docker networks on this host
      SMARTHOST: mail.smtp2go.com::2525
      SMTP_USERNAME: ${SMTP2GO_USER}
      SMTP_PASSWORD: ${SMTP2GO_PASSWORD}

networks:
  default:
    name: network_default
    external: true
