services:
  nextcloud-db:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: nextcloud-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /docker/nextcloud/db:/var/lib/postgresql/data
    restart: unless-stopped

  nextcloud-redis:
    image: redis:7.4.8-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    container_name: nextcloud-redis
    restart: unless-stopped

  nextcloud:
    image: nextcloud:30.0.17-apache@sha256:fb966733647ea03f0446b0c22eac9733c8eb616d37b960caca9d4c3010e14a08
    container_name: nextcloud
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: cloud.${DOMAIN}
      NEXTCLOUD_DATA_DIR: /nc-data
      REDIS_HOST: nextcloud-redis
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://cloud.${DOMAIN}
      TRUSTED_PROXIES: 172.16.0.0/12 192.168.1.0/24
      APACHE_DISABLE_REWRITE_IP: 1
    volumes:
      - /docker/nextcloud/html:/var/www/html   # app code, config, logs → /docker (125GB)
      - /data/nextcloud/data:/nc-data          # user files, documents → /data (14TB)
    extra_hosts:
      - "office.${DOMAIN}:192.168.1.224"
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`cloud.${DOMAIN}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"

  nextcloud-cron:
    image: nextcloud:30.0.17-apache@sha256:fb966733647ea03f0446b0c22eac9733c8eb616d37b960caca9d4c3010e14a08
    container_name: nextcloud-cron
    entrypoint: /cron.sh
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_DATA_DIR: /nc-data
    volumes:
      - /docker/nextcloud/html:/var/www/html   # must match nextcloud container
      - /data/nextcloud/data:/nc-data          # must match nextcloud container
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    restart: unless-stopped

  collabora:
    image: collabora/code:25.04.9.4.1@sha256:fe49c08c27e102c1877ad4ef2ac1a7bd8ccd2dfaa6641d4533389c204a92bb88
    container_name: collabora
    environment:
      - DONT_GEN_SSL_CERT=YES
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
    extra_hosts:
      - "cloud.${DOMAIN}:192.168.1.224"
    volumes:
      - /docker/nextcloud/collabora-config/coolwsd.xml:/etc/coolwsd/coolwsd.xml
    cap_add:
      - MKNOD
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.collabora.rule=Host(`office.${DOMAIN}`)"
      - "traefik.http.routers.collabora.entrypoints=websecure"
      - "traefik.http.services.collabora.loadbalancer.server.port=9980"

networks:
  default:
    name: network_default
    external: true
