services:
  termix:
    image: bugattiguy527/termix:26.11.3@sha256:f5a208e3c570fa5d3ec65dc2ad462eacf96e0d9a7f4f84410e5694f5a388f5ba
    container_name: termix
    restart: unless-stopped
    network_mode: host
    volumes:
     - /docker/termix-data:/app/data
    environment:
      PORT: "8081"

volumes:
  termix-data:
    driver: local
networks:
  dev_default:
    external: true