services:
  termix:
    image: bugattiguy527/termix:2.9.2@sha256:d64c841a560c54aa7c27b0e6bbd2fbf8b51073565040d2a6bfbc127f0a72cf1e
    container_name: termix
    restart: unless-stopped
    network_mode: host
    volumes:
     - /docker/termix-data:/app/data
    environment:
      PORT: "8081"

volumes:
  termix-data:
    driver: local
networks:
  dev_default:
    external: true