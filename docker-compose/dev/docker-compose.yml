services:
  termix:
    image: bugattiguy527/termix:release-1.11.2@sha256:1aeabcb75c70f2171879014c25a08b90164dd7350be86ae45c7eb7d9191a8428
    container_name: termix
    restart: unless-stopped
    network_mode: host
    volumes:
     - /docker/termix-data:/app/data
    environment:
      PORT: "8081"

volumes:
  termix-data:
    driver: local
networks:
  dev_default:
    external: true