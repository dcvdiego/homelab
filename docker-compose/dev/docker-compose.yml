services:
  termix:
    image: bugattiguy527/termix:26.11.1@sha256:cac04fdc9cd38c98566e6e903ad77a3a85b62869e6b78ada35e1570cbc32c6cb
    container_name: termix
    restart: unless-stopped
    network_mode: host
    volumes:
     - /docker/termix-data:/app/data
    environment:
      PORT: "8081"

volumes:
  termix-data:
    driver: local
networks:
  dev_default:
    external: true