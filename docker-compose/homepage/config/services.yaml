- Productivity:
    - Vikunja:
        icon: vikunja
        href: https://tasks.{{HOMEPAGE_VAR_DOMAIN}}
        description: Task & project management
    - Tandoor Recipes:
        icon: tandoor-recipes
        href: https://recipes.{{HOMEPAGE_VAR_DOMAIN}}
        description: Recipe manager
    - Obsidian LiveSync:
        icon: obsidian
        href: https://notesdb.{{HOMEPAGE_VAR_DOMAIN}}
        description: Note sync (CouchDB)

- Photos & Docs:
    - Immich:
        icon: immich
        href: https://fotos.{{HOMEPAGE_VAR_DOMAIN}}
        description: Photo & video management
        widget:
          type: immich
          url: https://fotos.{{HOMEPAGE_VAR_DOMAIN}}
          key: {{HOMEPAGE_VAR_IMMICH_KEY}}
