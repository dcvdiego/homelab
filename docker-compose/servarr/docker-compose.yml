version: '3.8'

services:
  prowlarr:
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
    hostname: prowlarr
    image: ghcr.io/hotio/prowlarr:release-1.29.2.4915@sha256:2c865dec77053e201345ba176f0744034558f09bf0b4b6dd6ea0722a4f075583
    restart: unless-stopped
    volumes:
      - /data:/data
      - /docker/prowlarr/Definitions/Custom:/Custom
      - /docker/prowlarr:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowl.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"

  radarr:
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
    hostname: radarr
    image: ghcr.io/hotio/radarr:release-5.17.2.9580@sha256:6c6268bfc233c59c4726c79f40141a177b2927fb20eee0ab400d92e0f42fd448
    restart: unless-stopped
    volumes:
      - /data:/data
      - /docker/radarr:/config
      - /docker/scripts:/scripts
      - /usr/bin/rclone:/usr/bin/rclone
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`rad.${DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    # depends_on:
    #   - rclone

  sonarr:
    container_name: sonarr
    environment:
      - PUID=1000
