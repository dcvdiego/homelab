  blackhole:
    image: cy01/blackhole:v0.4.0@sha256:1b67f858e26d13f82c884da220b934f66995fb343485210ff9de3d97d53e2a82 # running image predated every version tag; v0.4.0 is the oldest release
    container_name: blackhole
    ports:
      - "8282:8282" # qBittorrent
      - "8181:8181" # Proxy
    user: "1000:1000"
    volumes:
      - ./logs:/app/logs
      - /data:/data
      - /docker/blackhole/config.json:/app/config.json # Config file, see below
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - QBIT_PORT=8282 # qBittorrent Port. This is optional. You can set this in the config file
      - PORT=8181 # Proxy Port. This is optional. You can set this in the config file
    restart: unless-stopped

  sabnzbd:
    container_name: sabnzbd
    image: ghcr.io/hotio/sabnzbd:release-5.1.2@sha256:a6230c18f1ae176bc5020e8a93d572b7e60d475e4c358037c268e3d5fb75c921
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Europe/London
      - WEBUI_PORTS=8080/tcp
    volumes:
      - /docker/sabnzbd:/config
      - /data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.${DOMAIN}`)"
      - "traefik.http.routers.sabnzbd.entrypoints=websecure"
      - "traefik.http.services.sabnzbd.loadbalancer.server.port=8080"

