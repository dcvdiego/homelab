version: '3.8'

services:
  prowlarr:
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
    hostname: prowlarr
    image: ghcr.io/hotio/prowlarr:release
    restart: unless-stopped
    volumes:
      - /data:/data
      - /docker/prowlarr/Definitions/Custom:/Custom
      - /docker/prowlarr:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowl.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"

  radarr:
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
    hostname: radarr
    image: ghcr.io/hotio/radarr:release
    restart: unless-stopped
    volumes:
      - /data:/data
      - /docker/radarr:/config
      - /docker/scripts:/scripts
      - /usr/bin/rclone:/usr/bin/rclone
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`rad.${DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    # depends_on:
