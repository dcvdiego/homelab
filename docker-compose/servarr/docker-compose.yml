    restart: unless-stopped
    volumes:
      - /data:/data
      - /docker/scripts:/scripts
      - /docker/sonarr:/config
      - /usr/bin/rclone:/usr/bin/rclone
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`son.${DOMAIN}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
