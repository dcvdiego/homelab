http:
  routers:
    homeassistant:
      rule: 'Host(`ha.{{ env "DOMAIN" }}`)'
      entryPoints:
        - websecure
      service: homeassistant
      tls: {}

    termix:
      rule: 'Host(`term.{{ env "DOMAIN" }}`)'
      entryPoints:
        - websecure
      service: termix
      tls: {}

    komodo:   # Komodo Core on docker-tower; LAN/tailnet only (no Cloudflare route), Komodo's own login
      rule: 'Host(`komodo.{{ env "DOMAIN" }}`)'
      entryPoints:
        - websecure
      service: komodo
      tls: {}

  services:
    homeassistant:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8123"

    termix:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8081"

    komodo:
      loadBalancer:
        servers:
          - url: "http://192.168.1.248:9120"
