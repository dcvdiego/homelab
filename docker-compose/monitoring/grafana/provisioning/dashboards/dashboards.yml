# Dashboards from git (grafana/dashboards), in a "Homelab" folder. Edits in the UI can't be saved over
# them: export the JSON and commit it instead.
apiVersion: 1

providers:
  - name: homelab
    folder: Homelab
    type: file
    allowUiUpdates: false
    disableDeletion: true
    options:
      path: /etc/grafana/dashboards
