global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: node_exporter
    static_configs:
      - targets:
          - 192.168.1.224:9100  # docker-prod (LXC 101)
          - 192.168.1.248:9100  # docker-tower (LXC 104)
          - 192.168.1.148:9100  # pvehost (Proxmox)
        labels:
          env: homelab

  - job_name: frigate
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - frigate:5000  # frigate stack, network_default (5000 is not exposed on the host)
        labels:
          env: homelab
