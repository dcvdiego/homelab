version: "3"
services:
  loki:
    container_name: loki
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    volumes:
      - /docker/grafana-monitoring/loki:/etc/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    # Caps stop a runaway from taking the host down; GOMEMLIMIT (~80% of the cap) makes the Go GC
    # work harder before the cap is reached instead of growing until the kernel OOM-kills it.
    mem_limit: 384m
    environment:
      - GOMEMLIMIT=300MiB

  alloy:
    container_name: alloy
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    restart: unless-stopped
    hostname: docker-prod  # becomes the cAdvisor metrics' instance label
    mem_limit: 512m
    environment:
      - GOMEMLIMIT=400MiB
    volumes:
      - ./config/alloy-config.alloy:/etc/alloy/config.alloy:ro  # from git, not a copy on the host
      - /docker/grafana-monitoring/alloy/data:/var/lib/alloy/data
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # cAdvisor (container CPU/memory/network): reads the cgroup tree and Docker's metadata
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"

  grafana:
    user: "0"
    container_name: grafana
    image: grafana/grafana-oss:12.0.2@sha256:b5b59bfc7561634c2d7b136c4543d702ebcc94a3da477f21ff26f89ffd4214fa
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
    mem_limit: 384m
    volumes:
      - /docker/grafana-monitoring/grafana:/var/lib/grafana
      # Data sources and dashboards from git (grafana/): Prometheus is the default, the InfluxDB ones are deleted
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      # To enable Authentik forward auth: - "traefik.http.routers.grafana.middlewares=authentik-forwardauth@docker"

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    container_name: prometheus
    restart: unless-stopped
    ports:
      - 9090:9090
    # The image's own two flags, plus: keep 30 days (default 15) but never more than 5 GB on disk,
    # and accept Alloy's cAdvisor metrics by remote write. Data stays in the image's /prometheus volume.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-remote-write-receiver
    mem_limit: 768m
    environment:
      - GOMEMLIMIT=600MiB
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro  # from git, not a copy on the host

  # Proxmox host and guest metrics (CPU, memory, disk, network per LXC) for Prometheus. Read-only API
  # token (user prometheus@pve, role PVEAuditor) in /docker/grafana-monitoring/pve-exporter/token, written by an ops request; never in git.
  pve-exporter:
    container_name: pve-exporter
    image: prompve/prometheus-pve-exporter:3.12.0@sha256:e49466559449074596e762dd09c9a76c9be9b6a1ffacf7bc8ceb827169cb180e
    restart: unless-stopped
    init: true
    mem_limit: 128m
    # The token is read from a file, not env_file: Komodo runs compose inside its periphery container,
    # which can't see /docker/..., so an env_file there is silently skipped. A bind mount is resolved by
    # the Docker daemon on the host and works. The directory is mounted (not the file) so a missing
    # token can't make Docker create a directory in its place.
    volumes:
      - /docker/grafana-monitoring/pve-exporter:/run/pve:ro
    environment:
      - PVE_USER=prometheus@pve
      - PVE_TOKEN_NAME=exporter
      - PVE_TOKEN_VALUE_FILE=/run/pve/token  # root-owned dir, file owned by the image's uid 101, mode 400
      - PVE_VERIFY_SSL=false  # pvehost's self-signed certificate; LAN only

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.12@sha256:8e4b6bef96417ec98a35dc103c99cc64fc229a01e584e56d95d9004d2003c02a
    container_name: uptime-kuma
    restart: unless-stopped
    mem_limit: 1g  # node + its embedded MariaDB (~600 MB together today)
    volumes:
      - /docker/uptime-kuma:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`status.${DOMAIN}`)"
      - "traefik.http.routers.uptime.entrypoints=websecure"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"
      # To enable Authentik forward auth: - "traefik.http.routers.uptime.middlewares=authentik-forwardauth@docker"

networks:
  default:
    name: network_default
    external: true
