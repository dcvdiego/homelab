version: "3"
services:
  loki:
    container_name: loki
    image: grafana/loki:3.6.10
    volumes:
      - /docker/grafana-monitoring/loki:/etc/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml

  alloy:
    container_name: alloy
    image: grafana/alloy:v1.15.0
    restart: unless-stopped
    volumes:
      - /docker/grafana-monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /docker/grafana-monitoring/alloy/data:/var/lib/alloy/data
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"

  grafana:
    user: "0"
    container_name: grafana
    image: grafana/grafana-oss:12.0.2
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
    volumes:
    - /docker/grafana-monitoring/grafana:/var/lib/grafana
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      # To enable Authentik forward auth: - "traefik.http.routers.grafana.middlewares=authentik-forwardauth@docker"

  influxdb:
    container_name: influxdb
    image: influxdb:latest
    restart: unless-stopped
    ports:
      - 8086:8086
      - 8089:8089/udp
    volumes:
      - /docker/grafana-monitoring/influxdb:/var/lib/influxdb2

  telegraf:
    container_name: telegraf
    restart: unless-stopped
    volumes:
        - '/docker/grafana-monitoring/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro'
        - '/:/hostfs:ro'
        - '/var/run/docker.sock:/var/run/docker.sock'
        - '/docker/grafana-monitoring/telegraf/mibs:/usr/share/snmp/mibs'
    environment:
        - HOST_ETC=/hostfs/etc
        - HOST_PROC=/hostfs/proc
        - HOST_SYS=/hostfs/sys
        - HOST_VAR=/hostfs/var
        - HOST_RUN=/hostfs/run
        - HOST_MOUNT_PREFIX=/hostfs
    image: telegraf:latest
    user: telegraf:999

  prometheus:
    image: prom/prometheus:v3.11.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - 9090:9090
    volumes:
      - /docker/grafana-monitoring/prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - /docker/uptime-kuma:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`status.${DOMAIN}`)"
      - "traefik.http.routers.uptime.entrypoints=websecure"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"
      # To enable Authentik forward auth: - "traefik.http.routers.uptime.middlewares=authentik-forwardauth@docker"

networks:
  default:
    name: network_default
    external: true
